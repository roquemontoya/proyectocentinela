<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centinela 2.0</title>
    <link rel="stylesheet" href="style.css">
    <!-- Estilos de Leaflet para los mapas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Motor de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Barra Superior -->
    <header class="app-header">
        <div class="header-left-group">
            <button class="btn-header-inicio" onclick="irInicio()" title="Volver al Inicio">🏠</button>
            <div class="header-title">
                <span class="logo-icon">🛡️</span>
                <h1>Centinela 2.0</h1>
            </div>
        </div>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    </header>

    <!-- Menú Desplegable -->
    <nav id="side-menu" class="side-drawer">
        <div class="drawer-header">
            <span>🛡️ Módulos de Red</span>
            <button onclick="toggleMenu()" class="close-menu">&times;</button>
        </div>
        <ul class="drawer-list">
            <li onclick="cargarModulo('ecas')">📋 ECAS</li>
            <li onclick="cargarModulo('extintores')">🧯 Extintores</li>
            <li onclick="cargarModulo('hidrantes')">🚰 Hidrantes</li>
            <li onclick="cargarModulo('valvulas')">⚙️ Válvulas</li>
            <li onclick="cargarModulo('bomberos')">👨‍🚒 Personal / Bomberos</li>
            <li onclick="cargarModulo('ipp')">📦 IPP</li>
            <li onclick="cargarModulo('pecas')">🔧 PECAS</li>
            <li onclick="cargarModulo('vecas')">⚙️ VECAS</li>
        </ul>
    </nav>
    <div id="drawer-overlay" class="overlay" onclick="toggleMenu()"></div>

    <!-- Pantalla Principal: Tarjetas (Visible por defecto) -->
    <main id="main-content" class="dashboard-grid">
        <div class="card" onclick="cargarModulo('hidrantes')">
            <div class="card-img" style="font-size: 45px; text-align: center; margin: 15px 0;">🚰</div>
            <div class="card-title">Hidrantes</div>
        </div>
        <div class="card" onclick="cargarModulo('extintores')">
            <div class="card-img" style="font-size: 45px; text-align: center; margin: 15px 0;">🧯</div>
            <div class="card-title">Extintores</div>
        </div>
        <div class="card" onclick="cargarModulo('ecas')">
            <div class="card-img" style="font-size: 45px; text-align: center; margin: 15px 0;">📋</div>
            <div class="card-title">ECAS</div>
        </div>
        <div class="card" onclick="cargarModulo('valvulas')">
            <div class="card-img" style="font-size: 45px; text-align: center; margin: 15px 0;">⚙️</div>
            <div class="card-title">Válvulas</div>
        </div>
        <div class="card" onclick="cargarModulo('vecas')">
            <div class="card-img" style="font-size: 45px; text-align: center; margin: 15px 0;">⚙️</div>
            <div class="card-title">VECAS</div>
        </div>
        <div class="card" onclick="cargarModulo('pecas')">
            <div class="card-img" style="font-size: 45px; text-align: center; margin: 15px 0;">🔧</div>
            <div class="card-title">PECAS</div>
        </div>
        <div class="card" onclick="cargarModulo('bomberos')">
            <div class="card-img" style="font-size: 45px; text-align: center; margin: 15px 0;">👨‍🚒</div>
            <div class="card-title">Personal / Bomberos</div>
        </div>
        <div class="card" onclick="cargarModulo('ipp')">
            <div class="card-img" style="font-size: 45px; text-align: center; margin: 15px 0;">📦</div>
            <div class="card-title">IPP</div>
        </div>
    </main>

    <!-- Contenedor dinámico para mapas -->
    <div id="vista-dinamica" class="dynamic-container" style="display: none;"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="app.js"></script>

    <!-- Modal de Nuevo Control (Agnóstico) -->
    <div id="modal-control" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;">
        <div style="background: #1e1e1e; border: 1px solid #333; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; border-radius: 10px; padding: 20px; color: #fff; font-family: Arial, sans-serif;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px;">
                <h3 id="modal-titulo-elemento" style="margin: 0; color: #22c55e; font-size: 18px;">Nuevo Control</h3>
                <button type="button" onclick="cerrarFormularioControl()" style="background: none; border: none; color: #fff; font-size: 24px; cursor: pointer;">&times;</button>
            </div>

            <form id="form-nuevo-control" onsubmit="guardarControl(event)">
                <input type="hidden" id="input-id-db">
                <input type="hidden" id="input-idch">
                <input type="hidden" id="input-tabla">

                <!-- Inspector General (Común para todos) -->
                <label style="display: block; margin-bottom: 5px; font-size: 14px; font-weight: bold; color: #22c55e;">Control realizado por:</label>
                <input type="hidden" id="input-realizo" required>
                <div id="grid-seleccion-bombero" style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: thin;">
                    <p style="color: #aaa; font-size: 13px;">Cargando personal...</p>
                </div>

                <!-- CONTENEDOR DINÁMICO (Aquí cada .js inyectará sus campos exclusivos) -->
                <div id="contenedor-componentes-dinamicos"></div>

                <!-- Observaciones y Foto (Común para todos) -->
                <label style="display: block; margin-bottom: 5px; font-size: 14px;">Observaciones:</label>
                <textarea id="input-observacion" rows="3" style="width: 100%; padding: 8px; margin-bottom: 12px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px;" placeholder="Detalles de novedades..."></textarea>

                <label style="display: block; margin-bottom: 5px; font-size: 14px;">Foto de Auditoría (Obligatoria):</label>
                <input type="file" id="input-foto" accept="image/*" capture="environment" required style="width: 100%; margin-bottom: 20px; color: #ccc;">

                <div style="display: flex; gap: 10px;">
                    <button type="submit" style="flex: 1; background: #22c55e; color: #000; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer;">Guardar Control</button>
                    <button type="button" onclick="cerrarFormularioControl()" style="background: #333; color: #fff; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
