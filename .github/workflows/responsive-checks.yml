name: Responsive visual checks
on:
  push:
    branches:
      - feature/oculus-inspector
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/centinela-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/oculus.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/centinela-http.log
          exit 1
      - name: Run viewport matrix
        run: node tests/responsive-check.cjs
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots-and-report
          path: artifacts/responsive/
          if-no-files-found: warn
          retention-days: 14
